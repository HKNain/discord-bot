name: Contest Notifier

on:
  schedule:
    - cron: '30 18 * * *' # UTC 18:30 = 00:00 IST next day
  workflow_dispatch:

jobs:
  send-contest:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      CODEFORCES_WEBHOOK: ${{ secrets.CODEFORCES_WEBHOOK }}
      LEETCODE_WEBHOOK: ${{ secrets.LEETCODE_WEBHOOK }}
      CODECHEF_WEBHOOK: ${{ secrets.CODECHEF_WEBHOOK }}
      ATCODER_WEBHOOK: ${{ secrets.ATCODER_WEBHOOK }}
      CLIST_API_KEY: ${{ secrets.CLIST_API_KEY }}
      CLIST_USERNAME: ${{ secrets.CLIST_USERNAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Debug env presence (safe)
        run: |
          node -e "console.log('ATCODER_WEBHOOK length:', (process.env.ATCODER_WEBHOOK || '').length)"
          node -e "console.log('CLIST_API_KEY present:', (process.env.CLIST_API_KEY || '').length)"
          node -e "console.log('CLIST_USERNAME present:', (process.env.CLIST_USERNAME || '').length)"

      - name: Run contest notifier
        run: node index.js